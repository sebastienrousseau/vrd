#
# Codecov.io configuration. Aligns the cloud-side coverage
# measurement with the local `.tarpaulin.toml` exclusions so
# the two never disagree on which lines count.
#
# Reference: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    # Project-wide coverage threshold. Allow a 1 % drop before
    # failing — covers normal noise (e.g. a debug-only assert
    # added that tarpaulin counts differently across runs).
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    # Patch coverage — the PR's own diff must be fully tested.
    # Strict: any new line that isn't covered fails the PR.
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error

# Mirror the .tarpaulin.toml excludes. Both files cover code
# that a single-platform tarpaulin run cannot observe:
#
# - src/xoshiro_simd.rs is NEON-on-aarch64 / AVX2-on-x86_64;
#   validated by the dedicated `simd` CI matrix job.
# - src/float_libm.rs is the no_std FloatExt impl; `cargo test`
#   always runs with std, so these bodies never execute under
#   tarpaulin. Validated by the no_std embedded CI job.
ignore:
  - "src/xoshiro_simd.rs"
  - "src/float_libm.rs"
  - "examples/**"
  - "benches/**"
  - "tests/**"
  - "fuzz/**"
  - "scripts/**"
  - "doc/**"
  - "pkg/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
